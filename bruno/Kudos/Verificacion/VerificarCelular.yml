info:
  name: VerificarCelular
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/verificaciones/celular"
  body:
    type: json
    data: |-
      {
        "codigo": "{{codigo}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

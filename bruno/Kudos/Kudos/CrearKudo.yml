info:
  name: CrearKudo
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/kudos"
  body:
    type: json
    data: |-
      {
        "idDestinatario": "{{idPersona}}",
        "idCategoria": "{{idCategoria}}",
        "contenido": "Gracias por la asesoría antes del parcial; explicaste con mucha paciencia."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
